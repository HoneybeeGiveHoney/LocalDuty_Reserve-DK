
# ============================================== Начало целебного мха ==================================================================================================

- type: seed
  id: MagnificentMoss
  name: Целебный мох
  noun: seeds-noun-seeds
  displayName: Колония целебного мха
  plantRsi: _Duty/Specific/Hydroponics/Moss.rsi
  packetPrototype: MossSeeds
  productPrototypes:
    - FoodMoss
  lifespan: 60
  maturation: 6
  production: 9
  yield: 5
  potency: 15
  growthStages: 3
  idealHeat: 340
  waterConsumption: 2.5
  nutrientConsumption: -1
  harvestRepeat: Repeat
  chemicals:
    Water:
      Min: 35
      Max: 45
      PotencyDivisor: 10
    Omnizine:
      Min: 1
      Max: 5
      PotencyDivisor: 40

- type: entity
  name: Soggy Moss
  parent: [FoodProduceBase, BaseItem]
  id: FoodMoss
  description: Its very wet, and looks gross.
  components:
  - type: FlavorProfile
    flavors:
      - Moss
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 9
        reagents:
        - ReagentId: Water
          Quantity: 30
        - ReagentId: Omnizine
          Quantity: 1
  - type: Sprite
    sprite: _Duty/Specific/Hydroponics/Moss.rsi
  - type: Item
    heldPrefix: produce
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Water
        Quantity: 30
      - ReagentId: Nutriment
        Quantity: 20
  - type: ThrowingAngle
    angle: 180
  - type: LandAtCursor
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/gib2.ogg
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: SeedBase
  name: packet of Moss Spores
  id: MossSeeds
  components:
    - type: Seed
      seedId: MagnificentMoss
    - type: Sprite
      sprite: _Duty/Specific/Hydroponics/Moss.rsi
      state: Moss_Spores
# ============================================== Конец целебного мха ===================================================================================================

# ============================================== Начало Грозовой капусты ===============================================================================================

- type: seed
  id: ElectroCabbage
  name: Гром-капуста
  noun: seeds-noun-seeds
  displayName: Гром-капуста
  plantRsi: _Duty/Specific/Hydroponics/ElectroCabbage.rsi
  packetPrototype: ElectroCabbageSeeds
  productPrototypes:
    - FoodElectroCabbage
  lifespan: 50
  maturation: 9
  production: 3
  yield: 3
  potency: 15
  growthStages: 1
  chemicals:
    Licoxide:
      Min: 1
      Max: 10
      PotencyDivisor: 20
    Plasma:
      Min: 5
      Max: 30
      PotencyDivisor: 30

- type: entity
  name: Electro Cabbage
  parent: [FoodProduceBase, BaseItem]
  id: FoodElectroCabbage
  description: crackling with lightnings. Better not to eat.
  components:
  - type: FlavorProfile
    flavors:
      - Moss
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 9
        reagents:
        - ReagentId: Licoxide
          Quantity: 5
        - ReagentId: SulfuricAcid
          Quantity: 10
  - type: Sprite
    layers:
      - sprite: _Duty/Specific/Hydroponics/ElectroCabbage.rsi
        state: produce
      - sprite: _Duty/Specific/Hydroponics/ElectroCabbage.rsi
        state: Unshaded_produce
        shader: unshaded
  - type: Item
    heldPrefix: produce
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: SulfuricAcid
        Quantity: 30
  - type: Electrified
    shockDamage: 5
    requirePower: false
    ignoreInsulation: false
  - type: Tag
    tags:
    - ElectroCabbageTag

- type: entity
  parent: SeedBase
  name: packet of electro cabbage seeds
  id: ElectroCabbageSeeds
  components:
    - type: Seed
      seedId: ElectroCabbage
    - type: Sprite
      sprite: _Duty/Specific/Hydroponics/ElectroCabbage.rsi
      state: Seed

- type: entity
  id: CabbageGenerator
  description: Um... its """"Generator""""
  suffix: Generator
  name: Cabbage generator
  parent: [ BaseGenerator ]
  placement:
    mode: SnapgridCenter
  components:
  - type: InteractionOutline
  - type: Transform
    anchored: true
    noRot: true
  - type: Sprite
    sprite: _Duty/Structures/Power/CabbageGenerator.rsi
    state: generator
    snapCardinals: true
  - type: NodeContainer
    examinable: true
    nodes:
      output:
        !type:CableDeviceNode
        nodeGroupID: MVPower
  - type: PowerMonitoringDevice
    group: Generator
    loadNode: output
    sprite: _Duty/Structures/Power/CabbageGenerator.rsi
    state: generator
  - type: PowerSupplier
    supplyRate: 4000
    supplyRampRate: 500
    supplyRampTolerance: 500
    voltage: Medium
  - type: Anchorable
  - type: Pullable
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Wood # ну, я не слишком знаю какой множитель поставить ДЛЯ ГЕНЕРАТОРА ИЗ КАПУСТЫ
  - type: PacifismDangerousAttack
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/gib2.ogg
      - !type:ExplodeBehavior
  - type: StaticPrice
    price: 400
  - type: Electrified
    onHandInteract: false
    onInteractUsing: true
    onBump: false
    requirePower: true
    highVoltageNode: output
  - type: Explosive
    explosionType: Cryo
    maxIntensity: 30
    intensitySlope: 1
    totalIntensity: 200
  - type: Construction
    graph: CabbageGeneratorRecipe
    node: done

- type: entity
  parent: [ BasePowerCell ]
  id: CabbageBattery
  name: Cabbage battery
  description: Its... very creatively.
  components:
  - type: Sprite
    sprite: _Duty/Objects/Power/CabbageBattery.rsi
    layers:
    - map: [ "enum.PowerCellVisualLayers.Base" ]
      state: CabbageBattery
    - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
      state: o2
      shader: unshaded
  - type: Item
    storedRotation: -90
  - type: Battery
    maxCharge: 180
    startingCharge: 180
    pricePerJoule: 0.15
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 0.4
  - type: Construction
    graph: CabbageBatteryRecipe
    node: done

# ============================================== начало крафта из грозовой капусты
- type: construction
  id: CabbageGeneratorCraft
  graph: CabbageGeneratorRecipe
  startNode: start
  targetNode: done
  category: construction-category-structures
  objectType: Item

- type: construction
  id: CabbageBatteryCraft
  graph: CabbageBatteryRecipe
  startNode: start
  targetNode: done
  category: construction-category-misc
  objectType: Item

- type: constructionGraph
  id: CabbageBatteryRecipe
  start: start
  graph:
  - node: start
    edges:
    - to: done
      steps:
      - material: MetalRod
        amount: 2
      - material: Cable
        amount: 2
      - tag: ElectroCabbageTag
        icon:
          sprite: _Duty/Specific/Hydroponics/ElectroCabbage.rsi
          state: icon
      doAfter: 6
  - node: done
    entity: CabbageBattery

- type: constructionGraph
  id: CabbageGeneratorRecipe
  start: start
  graph:
  - node: start
    edges:
    - to: done
      steps:
      - material: WoodPlank
        amount: 20
      - material: MetalRod
        amount: 6
      - material: CableMV
        amount: 15
      - tag: ElectroCabbageTag
        icon:
          sprite: _Duty/Specific/Hydroponics/ElectroCabbage.rsi
          state: icon
      - tag: ElectroCabbageTag
        icon:
          sprite: _Duty/Specific/Hydroponics/ElectroCabbage.rsi
          state: icon
      - tag: ElectroCabbageTag
        icon:
          sprite: _Duty/Specific/Hydroponics/ElectroCabbage.rsi
          state: icon
        doAfter: 5
  - node: done
    entity: CabbageGenerator
# ============================================== конец крафта из грозовой капусты
